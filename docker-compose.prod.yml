version: '3,8'                                                                                                   

services:
  web:
    build:
      context: ./
      dockerfile: dockerfile.prod
    command: gunicorn little_wms.wsgi:application --bind 0.0.0.0:8567
    volumes:
      - static_volume:/home/app/web/staticfiles
    expose:
      - 8567
    env_file:
      - ./.env.prod
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.db
  nginx:
    build: ./nginx
    volumes:
      - static_volume:/home/app/web/staticfiles
    ports:
      - 8567:80
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:

