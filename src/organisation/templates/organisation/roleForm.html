{% extends "hub/header.html" %}
{% load i18n %}

{% block content %}
<h4>{{ role.name }}</h4>

<form method="post" action="{% url 'role save' role.pk %}">
    {% csrf_token %}
    <table class="table table-sm">
        <thead>
            <tr><th>{% trans "Object" %}</th><th>{% trans "Scope" %}</th><th>{% trans "Action" %}</th><th>{% trans "Granted" %}</th></tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ row.obj }}</td>
                <td>{{ row.scope }}</td>
                <td>{{ row.action }}</td>
                <td>
                    <input class="form-check-input" type="checkbox" name="perm"
                           value="{{ row.codename }}" {% if row.checked %}checked{% endif %}>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button class="btn btn-primary">{% trans "Save" %}</button>
    <a class="btn btn-outline-secondary" href="{% url 'roles' %}">{% trans "Back" %}</a>
</form>
{% endblock %}
