{% extends "hub/header.html" %}

{% block content %}
<h4>{{ role.name }}</h4>

<form method="post" action="{% url 'role save' role.pk %}">
    {% csrf_token %}
    <table class="table table-sm">
        <thead>
            <tr><th>Object</th><th>Scope</th><th>Action</th><th>Granted</th></tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ row.obj }}</td>
                <td>{{ row.scope }}</td>
                <td>{{ row.action }}</td>
                <td>
                    <input class="form-check-input" type="checkbox" name="perm"
                           value="{{ row.value }}" {% if row.checked %}checked{% endif %}>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'roles' %}">Back</a>
</form>
{% endblock %}
