{% extends "hub/header.html" %}
{% load i18n %}

{% block content %}
{% if record %}
<div class="alert alert-success">
    {% blocktrans with email=record.email %}Your email address <strong>{{ email }}</strong> is now confirmed.{% endblocktrans %}
</div>
{% else %}
<div class="alert alert-warning">
    {% trans "This confirmation link is invalid." %}
</div>
{% endif %}
{% endblock %}
