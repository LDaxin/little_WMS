{% extends "hub/header.html" %}

{% block content %}
<h4>Email preferences</h4>
<p class="text-muted">Choose which emails you want to receive. Emails are only sent to a confirmed address.</p>

<form method="post">
    {% csrf_token %}
    {% for category in categories %}
    <div class="form-check">
        <input class="form-check-input" type="checkbox" name="{{ category.value }}"
               id="cat-{{ category.value }}" {% if category.subscribed %}checked{% endif %}>
        <label class="form-check-label" for="cat-{{ category.value }}">{{ category.label }}</label>
    </div>
    {% endfor %}
    <button class="btn btn-primary mt-3">Save</button>
</form>
{% endblock %}
