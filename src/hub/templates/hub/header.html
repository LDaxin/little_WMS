<!DOCTYPE html>
<html>
    <head>
        {% load livereload_tags %}
        {% load static %}
        <link rel="stylesheet" href="{% static 'hub/bootstrap/css/bootstrap.min.css' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
        <script src="{% static 'hub/jquery/jquery.min.js' %}"></script>
        <script src="{% static 'hub/bootstrap/js/bootstrap.min.js' %}"></script>
        <script src="https://unpkg.com/html5-qrcode" type="text/javascript">
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <script src="https://unpkg.com/htmx.org@1.9.7"></script>
        {% livereload_script %}
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <div aria-live="polite" aria-atomic="true" class="position-relative">
            <div class="toast-container position-fixed top-0 end-0 p-3">


            </div>
        </div>

        <nav class="navbar sticky-top bg-light">
          <div class="container-fluid {% if not request.user.is_authenticated %} d-flex justify-content-center {% endif %}">

                <a class="navbar-brand">
                    {% if symbol == None %}
                        <img style="width:50px" src="{% static 'hub/symbols/Logo.svg' %}">
                    {% else %}
                        <img style="width:50px" src="{% static 'hub/symbols/'|add:symbol|add:'.svg' %}">
                    {% endif %}
                </a>

                {% if request.user.is_authenticated %}

                <form method="post" action="/accounts/logout/" style="display: inline;">
                    {% csrf_token %}
                    <button class="btn btn-light" type="submit">
                        <img style="width:45px" src="{% static 'hub/symbols/Signout.svg' %}">
                    </button>
                </form>
                <a class="btn btn-light" type="button" href="/accounts/password_change"><img style="width:45px" src="{% static 'hub/symbols/Setting.svg' %}"></a>
                {% if request.path != "/" %}
                    <a class="btn btn-light" type="button" onClick="javascript:history.back();"><img style="width:45px" src="{% static 'hub/symbols/Back.svg' %}"></a>
                {% endif %}
                {% endif %}

            </div>
        </nav>
        
        <div class="container-fluid">
        {% block content %}

        {% endblock %}
        </div>

        <script>
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    // Page was loaded from bfcache (back/forward navigation)
                    window.location.reload();
                }
            });
        </script>




    </body>

</html>
