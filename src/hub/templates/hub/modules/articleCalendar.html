{% load i18n %}
<div id="articleCalendar" class="p-2 border rounded mb-2">
    <h6>{% trans "Calendar" %}</h6>
    <ul class="list-group list-group-flush">
        {% for term in articleTerms %}
        <li class="list-group-item py-1 d-flex justify-content-between align-items-center">
            <span>{% if term.url %}<a href="{{ term.url }}">{{ term.label }}</a>{% else %}{{ term.label }}{% endif %}</span>
            <span class="text-muted small">{{ term.date|date:"Y-m-d" }}</span>
        </li>
        {% empty %}
        <li class="list-group-item text-muted">{% trans "No terms" %}</li>
        {% endfor %}
    </ul>
    <form method="post" action="{% url 'add maintenance' typ id %}" class="d-flex gap-2 mt-2">
        {% csrf_token %}
        <input name="title" class="form-control form-control-sm" placeholder="{% trans "Maintenance" %}" style="max-width:14rem">
        <input name="due_date" type="date" class="form-control form-control-sm" style="max-width:10rem">
        <button class="btn btn-sm btn-outline-secondary">{% trans "Add maintenance" %}</button>
    </form>
    <form method="post" action="{% url 'lend article' typ id %}" class="d-flex gap-2 mt-2">
        {% csrf_token %}
        <input name="borrower_name" class="form-control form-control-sm" placeholder="{% trans "Borrower" %}" style="max-width:12rem">
        <input name="borrower_email" type="email" class="form-control form-control-sm" placeholder="{% trans "Email" %}" style="max-width:12rem">
        <input name="start_date" type="date" class="form-control form-control-sm" style="max-width:10rem">
        <input name="end_date" type="date" class="form-control form-control-sm" style="max-width:10rem">
        <button class="btn btn-sm btn-outline-secondary">{% trans "Lend" %}</button>
    </form>
    <form method="post" action="{% url 'borrow article' typ id %}" class="d-flex gap-2 mt-2">
        {% csrf_token %}
        <select name="lender_type" class="form-select form-select-sm" style="max-width:10rem">
            <option value="person">{% trans "Person" %}</option>
            <option value="organisation">{% trans "Organisation" %}</option>
        </select>
        <input name="lender_name" class="form-control form-control-sm" placeholder="{% trans "Lender" %}" style="max-width:12rem">
        <input name="start_date" type="date" class="form-control form-control-sm" style="max-width:10rem">
        <input name="end_date" type="date" class="form-control form-control-sm" style="max-width:10rem">
        <button class="btn btn-sm btn-outline-secondary">{% trans "Borrow" %}</button>
    </form>
</div>
