{% load i18n %}

<form method="POST" action="{{ updateUrl }}" id="{{id}}{{ actionType }}Form">
    {% csrf_token %}
    <input type="hidden" name="version" value="{{ version }}">

    {% for p_form in form %}
        {% for field in p_form %}
        
            <div class="form-floating mb-2">
                <div class="input-group">
                    <span class="input-group-text">{{ field.label }}</span>

                    {{ field.error }}
                    {{ field }}
                    
                    {% if field.name == "stored" or field.name == "code"%}
                    <div id="QRButtonDiv{{field.auto_id}}">
                        <button 
                            id="QRButton{{field.auto_id}}" 
                            class="btn btn-primary scanner" 
                            type="button" 
                            hx-post="{{ scannerBaseUrl }}/{{field.auto_id}}/toggle" 
                            hx-swap="outerHTML"
                            hx-target="#scannerDiv{{field.auto_id}}" 
                            hx-trigger="click">
                            {% trans "QR" %}
                        </button>
                    </div>
                </div>
            </div>

            <div id="infoDiv{{field.auto_id}}">
            </div>

            <div id="scannerDiv{{field.auto_id}}">
            </div>
                {% else %}
                </div>
            </div>
                {% endif %}
        {% endfor %}
    {% endfor %}
    <button type="submit" class="btn btn-success" id="{{actionType}}Button" hx-trigger="click" hx-post="{{ updateUrl }}" hx-swap="afterbegin" hx-target=".toast-container">{{actionType}}</button>
</form>

<script>
    $("#id_tag_change").select2({
        theme: "bootstrap-5",
        dropdownParent: $("#modal{{modalId}}"),
        width: "100%",
        placeholder: "{% trans "Select tags" %}"
    });
    $("#id_unit_change").select2({
        theme: "bootstrap-5",
        dropdownParent: $("#modal{{modalId}}"),
        width: "100%",
        placeholder: "{% trans "Select tags" %}"
    });
    $("#id_parent_change").select2({
        theme: "bootstrap-5",
        dropdownParent: $("#modal{{modalId}}"),
        width: "100%",
        placeholder: "{% trans "Select patent" %}"
    });
    document.body.addEventListener("htmx:confirm", function (e) {
        if (e.detail.elt && e.detail.elt.id === "{{actionType}}Button") {
            var menge = document.querySelector("[name$='-menge']");
            if (menge && menge.value === "0" && !confirm("{% trans "Setting menge to 0 deletes the article. Continue?" %}")) {
                e.preventDefault();
            }
        }
    });
</script>
