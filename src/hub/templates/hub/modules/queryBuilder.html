{% load i18n %}
<div id="queryBuilder" class="p-2 border rounded mb-2" style="display:none">
    <div class="d-flex justify-content-between align-items-center">
        <strong>{% trans "Advanced search" %}</strong>
        <button type="button" class="btn-close" onclick="qbToggle()"></button>
    </div>
    <div id="qbRoot" class="mt-2"></div>
    <form id="qbForm" hx-get="./search" hx-target="#list" class="mt-2 d-flex gap-2">
        <input type="hidden" name="query" id="qbQueryInput">
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="qbAddCondition(qbState)">+ {% trans "Condition" %}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="qbAddGroup(qbState)">+ {% trans "Group" %}</button>
        <button class="btn btn-sm btn-success">{% trans "Apply" %}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="qbClear()">{% trans "Clear" %}</button>
    </form>
    <form method="post" action="/views/save/" class="mt-2 d-flex gap-2 align-items-center"
          onsubmit="document.getElementById('qbSaveQuery').value = JSON.stringify(qbState);">
        {% csrf_token %}
        <input type="hidden" name="query" id="qbSaveQuery">
        <input type="hidden" name="typ" value="{{ name }}">
        <input type="hidden" name="next" value="{{ request.path }}">
        <input type="hidden" name="sort" value="{{ sort }}">
        <input type="hidden" name="cols" value="{{ cols }}">
        <input name="name" class="form-control form-control-sm" placeholder="{% trans "View name" %}" style="max-width:14rem">
        <label class="form-check-label d-flex align-items-center gap-1"><input type="checkbox" name="is_shared" class="form-check-input"> {% trans "Share" %}</label>
        <button class="btn btn-sm btn-outline-primary">{% trans "Save as View" %}</button>
    </form>
</div>

<script>
const QB_FIELDS = [
    ["base__name", "{% trans "Name" %}", "text"],
    ["code__code", "{% trans "Code" %}", "text"],
    ["zustand", "{% trans "Condition" %}", "choice"],
    ["ist_verbrauchsartikel", "{% trans "Consumable" %}", "boolean"],
    ["gewicht_gramm", "{% trans "Weight" %}", "number"],
    ["ablaufdatum", "{% trans "Expiry" %}", "date"],
    ["kaufdatum", "{% trans "Purchase date" %}", "date"],
    ["tags__name", "{% trans "Tag" %}", "text"],
];
const QB_OPS = {
    text: [["eq", "="], ["ne", "≠"], ["contains", "{% trans "contains" %}"], ["starts", "{% trans "starts" %}"], ["ends", "{% trans "ends" %}"], ["empty", "{% trans "is empty" %}"], ["not_empty", "{% trans "is not empty" %}"]],
    number: [["eq", "="], ["ne", "≠"], ["lt", "<"], ["gt", ">"], ["lte", "≤"], ["gte", "≥"], ["empty", "{% trans "is empty" %}"]],
    date: [["eq", "="], ["ne", "≠"], ["before", "{% trans "before" %}"], ["after", "{% trans "after" %}"], ["empty", "{% trans "is empty" %}"]],
    choice: [["eq", "="], ["ne", "≠"]],
    boolean: [["is_true", "{% trans "is true" %}"], ["is_false", "{% trans "is false" %}"]],
};
let qbState = {type: "AND", conditions: []};
const SAVED_QUERY = {{ savedQuery|default:"null"|safe }};
if (SAVED_QUERY) { qbState = SAVED_QUERY; }

function qbFieldType(field) {
    const f = QB_FIELDS.find((x) => x[0] === field);
    return f ? f[2] : "text";
}

function qbToggle() {
    const el = document.getElementById("queryBuilder");
    el.style.display = el.style.display === "none" ? "block" : "none";
}

function qbAddCondition(group) {
    group.conditions.push({field: QB_FIELDS[0][0], op: "eq", value: ""});
    qbRender();
}

function qbAddGroup(group) {
    group.conditions.push({type: "AND", conditions: []});
    qbRender();
}

function qbRemove(parent, index) {
    parent.conditions.splice(index, 1);
    qbRender();
}

function qbClear() {
    qbState = {type: "AND", conditions: []};
    qbRender();
}

function qbRenderCondition(cond, parent, index) {
    const row = document.createElement("div");
    row.className = "d-flex gap-1 mb-1 ms-2";

    const field = document.createElement("select");
    field.className = "form-select form-select-sm";
    field.style.maxWidth = "12rem";
    QB_FIELDS.forEach(([value, label]) => {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        if (cond.field === value) opt.selected = true;
        field.appendChild(opt);
    });
    field.onchange = () => { cond.field = field.value; cond.op = "eq"; qbRender(); };
    row.appendChild(field);

    const op = document.createElement("select");
    op.className = "form-select form-select-sm";
    op.style.maxWidth = "10rem";
    (QB_OPS[qbFieldType(cond.field)] || []).forEach(([value, label]) => {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        if (cond.op === value) opt.selected = true;
        op.appendChild(opt);
    });
    op.onchange = () => { cond.op = op.value; qbRender(); };
    row.appendChild(op);

    const needsValue = !["empty", "not_empty", "is_true", "is_false"].includes(cond.op);
    const value = document.createElement("input");
    value.className = "form-control form-control-sm";
    value.style.maxWidth = "12rem";
    value.value = cond.value || "";
    value.disabled = !needsValue;
    value.oninput = () => { cond.value = value.value; };
    row.appendChild(value);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "btn btn-sm btn-outline-danger py-0";
    del.textContent = "−";
    del.onclick = () => qbRemove(parent, index);
    row.appendChild(del);

    const not = document.createElement("button");
    not.type = "button";
    not.className = "btn btn-sm py-0 " + (cond.negate ? "btn-danger" : "btn-outline-danger");
    not.textContent = "NOT";
    not.onclick = () => { cond.negate = !cond.negate; qbRender(); };
    row.appendChild(not);

    return row;
}

function qbRenderGroup(group, parent, index) {
    const box = document.createElement("div");
    box.className = "border rounded p-1 mb-1 ms-2";
    box.style.borderColor = group.negate ? "#dc3545" : (group.type === "OR" ? "#fd7e14" : "#0d6efd");

    const head = document.createElement("div");
    head.className = "d-flex gap-1 align-items-center mb-1";

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "btn btn-sm btn-outline-secondary py-0";
    toggle.textContent = group.type;
    toggle.onclick = () => { group.type = group.type === "AND" ? "OR" : "AND"; qbRender(); };
    head.appendChild(toggle);

    const not = document.createElement("button");
    not.type = "button";
    not.className = "btn btn-sm btn-outline-danger py-0";
    not.textContent = group.negate ? "NOT" : "not";
    not.onclick = () => { group.negate = !group.negate; qbRender(); };
    head.appendChild(not);

    if (index !== null && index !== undefined) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "btn btn-sm btn-outline-primary py-0";
        add.textContent = "+";
        add.onclick = () => qbAddCondition(group);
        head.appendChild(add);

        const addGroup = document.createElement("button");
        addGroup.type = "button";
        addGroup.className = "btn btn-sm btn-outline-secondary py-0";
        addGroup.textContent = "+()";
        addGroup.onclick = () => qbAddGroup(group);
        head.appendChild(addGroup);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn btn-sm btn-outline-danger py-0";
        del.textContent = "−";
        del.onclick = () => qbRemove(parent, index);
        head.appendChild(del);
    }
    box.appendChild(head);

    group.conditions.forEach((child, i) => {
        if (child.conditions) {
            box.appendChild(qbRenderGroup(child, group, i));
        } else {
            box.appendChild(qbRenderCondition(child, group, i));
        }
    });
    return box;
}

function qbRender() {
    const root = document.getElementById("qbRoot");
    root.innerHTML = "";
    root.appendChild(qbRenderGroup(qbState, null, null));
}

document.getElementById("qbForm").addEventListener("submit", function () {
    document.getElementById("qbQueryInput").value = JSON.stringify(qbState);
});

qbRender();
</script>
