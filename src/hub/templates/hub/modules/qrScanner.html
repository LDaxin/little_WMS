{# Reusable QR scanner: button + hidden active_scanner + container.
   Params: input (element id), scannerUrl (toggle endpoint). #}
<button type="button" id="QRButton{{ input }}" class="btn btn-primary scanner"
        hx-post="{{ scannerUrl }}" hx-swap="outerHTML" hx-target="#scannerDiv{{ input }}" hx-trigger="click">QR</button>
<input class="visually-hidden" id="activ-scanner-input" name="active_scanner">
<div id="scannerDiv{{ input }}" class="w-100"></div>
