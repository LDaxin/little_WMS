{% load i18n %}
{# Reusable QR scanner button + hidden active_scanner. Params: input (id), scannerUrl. Add <div id="scannerDiv{{ input }}"></div> outside the input-group. #}
<button type="button" id="QRButton{{ input }}" class="btn btn-primary scanner"
        hx-post="{{ scannerUrl }}" hx-swap="outerHTML" hx-target="#scannerDiv{{ input }}" hx-trigger="click">{% trans "QR" %}</button>
<input class="visually-hidden" id="activ-scanner-input" name="active_scanner">
