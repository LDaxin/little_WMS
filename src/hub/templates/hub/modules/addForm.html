<form method="POST" action="./add" id="addForm">
    {% csrf_token %}

    {% for p_form in form %}
        {% for field in p_form %}

            <div class="form-floating mb-2">
                <div class="input-group">
                    <span class="input-group-text">{{ field.label }}</span>

                    {{ field.error }}
                    {{ field }}

                    {% if field.name == "stored" or field.name == "code"%}
                    <div id="QRButtonDiv{{field.auto_id}}">
                        <button 
                            id="QRButton{{field.auto_id}}" 
                            class="btn btn-primary scanner" 
                            type="button" 
                            hx-post="./scanner/{{field.auto_id}}/toggle" 
                            hx-swap="outerHTML"
                            hx-target="#scannerDiv{{field.auto_id}}" 
                            hx-trigger="click">
                            QR
                        </button>
                    </div>
                </div>
            </div>

            <div id="scannerDiv{{field.auto_id}}">
            </div>
                    {% else %}
                </div>
            </div>
            {% endif %}

        {% endfor %}
    {% endfor %}
    <input class="visually-hidden" id="activ-scanner-input" name="active_scanner">
    <button class="btn btn-success text-center" hx-trigger="click" hx-post="./add" hx-swap="afterbegin" hx-target=".toast-container" hx-disabled-elt="this" hx-indicator="#loading-spinner">
      <span class="btn-label">Add</span>
      <span id="loading-spinner" class="htmx-indicator">
      <div id="loading-spinner" class="spinner-border spinner-border-sm htmx-indicator" role="status">
      </div>
      </span>
    </button>
</form>

<script>
    $("#id_parent").select2({
        theme: "bootstrap-5",
        dropdownParent: $("#modal{{modalId}}"),
        width: "100%",
        placeholder: "Select parent"
    });
    function closeScanner() {
        console.log("hello");
    };
</script>
