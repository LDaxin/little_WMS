{% load i18n %}
<div id="qrModalInner">
    <p>{% trans "Print QR codes for these items:" %}</p>
    <ul id="qrList"></ul>
    <form method="POST" action="/qr/print" target="_blank" id="qrForm">
        {% csrf_token %}
        <input type="hidden" name="type" value="{{ type }}">
        <input type="hidden" name="typ" value="{{ typ }}">
        <div class="mb-2">
            <label class="form-label">{% trans "Format" %}</label>
            <select name="format" class="form-select">
                <option value="2x4">2 × 4</option>
                <option value="3x7" selected>3 × 7</option>
                <option value="4x10">4 × 10</option>
            </select>
        </div>
        <div class="mb-2">
            <label class="form-label">{% trans "QR size" %}</label>
            <select name="size" class="form-select">
                <option value="small">{% trans "Small" %}</option>
                <option value="medium" selected>{% trans "Medium" %}</option>
                <option value="large">{% trans "Large" %}</option>
            </select>
        </div>
        <div class="mb-2">
            <label class="form-label">{% trans "Label" %}</label>
            <select name="label" class="form-select">
                <option value="code">{% trans "QR only" %}</option>
                <option value="name" selected>{% trans "QR + name" %}</option>
                <option value="full">{% trans "QR + name + symbol" %}</option>
            </select>
        </div>
        <div class="mb-2">
            <label class="form-label">{% trans "QR content" %}</label>
            <select name="qr" class="form-select">
                <option value="code" selected>{% trans "Code (app scanner)" %}</option>
                <option value="link">{% trans "Link (universal)" %}</option>
            </select>
        </div>
        <div class="mb-2">
            <label class="form-label">{% trans "Sort" %}</label>
            <select name="sort" class="form-select">
                <option value="name" selected>{% trans "Name" %}</option>
                <option value="code">{% trans "Code" %}</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">{% trans "Print" %}</button>
    </form>
    <script>
        $(document).on("change", "#checkAll", function(){
            if(this.checked){
                $(".checkboxlist").each(function(){
                    $("#qrList").append("<li class='"+ this.id +"_'> "+ this.value +" </li>");
                    $("#qrForm").append("<input type=\"hidden\" name='_"+ this.id +"' class='"+ this.id +"_' value="+ this.id +"> ");
                });
            }else{
                $(".checkboxlist").each(function(){
                    $("."+ this.id +"_").remove();
                });
            }
        });

        $(document).on("change", ".checkboxlist", function(){
            if(this.checked){
                $("#qrList").append("<li class='"+ this.id +"_'> "+ this.value +" </li>");
                $("#qrForm").append("<input type=\"hidden\" name='_"+ this.id +"' class='"+ this.id +"_' value="+ this.id +"> ");
            }else{
                $("."+ this.id +"_").remove();
            }
        });
    </script>
</div>
