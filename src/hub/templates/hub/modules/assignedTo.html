{% load i18n %}
<div id="assignedTo" class="p-2 border rounded mb-2">
    <h6>{% trans "Assigned to" %}</h6>
    <ul class="list-group list-group-flush">
        {% for user in assignees %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ user }}
            <button type="button" class="btn-close" aria-label="{% trans "Unassign" %}"
                    hx-post="{{ unassignUrl }}/{{ user.pk }}"
                    hx-target="#assignedTo" hx-swap="outerHTML"></button>
        </li>
        {% empty %}
        <li class="list-group-item text-muted">{% trans "Nobody" %}</li>
        {% endfor %}
    </ul>
    <form class="mt-2" hx-post="{{ assignUrl }}" hx-target="#assignedTo" hx-swap="outerHTML">
        {% csrf_token %}
        <div class="input-group input-group-sm">
            <select name="user" class="form-select">
                {% for user in allUsers %}<option value="{{ user.pk }}">{{ user }}</option>{% endfor %}
            </select>
            <button class="btn btn-success">{% trans "Assign" %}</button>
        </div>
    </form>
</div>
