<div id="auditTimeline" class="p-2 border rounded mb-2">
    <h6>History</h6>
    <ul class="list-group list-group-flush">
        {% for entry in auditLogs %}
        <li class="list-group-item py-1 small">
            <span class="text-muted">{{ entry.timestamp|date:"Y-m-d H:i" }}</span>
            · {{ entry.action }}
            {% if entry.user %}· {{ entry.user }}{% endif %}
            {% if entry.changes %}<div class="text-muted">{{ entry.changes }}</div>{% endif %}
        </li>
        {% empty %}
        <li class="list-group-item text-muted">No history</li>
        {% endfor %}
    </ul>
</div>
