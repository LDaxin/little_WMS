{% load i18n list_columns %}
<div class="col-12 col-md-6 col-lg-4">
    <div class="card h-100">
        {% with img=stock.article.primary_image %}{% if img %}<img src="{{ img.thumbnail.url }}" class="card-img-top" style="object-fit:cover;height:120px">{% endif %}{% endwith %}
        <div class="card-body">
            <input class="checkboxlist form-check-input card-check" type="checkbox" value="{{ stock.article }}" id="{{ stock.article.id }}">
            <h6 class="card-title mb-1">{{ stock.article.base.name }}</h6>
            <div class="small text-muted">{{ stock.article.code.code }}</div>
            <div class="small">{{ stock.article.base.pType.name }}</div>
            <div class="small">{{ stock.stored|space_path }} &middot; {{ stock.menge }}</div>
            <span class="badge bg-{{ stock.article.zustand|condition_color }}">{{ stock.article.zustand|condition_label }}</span>
        </div>
        <a class="stretched-link" href="{% url 'article' typ=stock.article.base.pType.name articleId=stock.article.pk %}"></a>
    </div>
</div>
