{% extends "hub/header.html" %}

{% block content %}

<form id="scanForm" class="mb-2" hx-post="{% url 'movement scan' %}" hx-target="#movementBuffer" hx-swap="outerHTML"
      hx-on::after-request="document.getElementById('scan').value=''">
    {% csrf_token %}
    <div class="input-group">
        <input id="scan" name="code" class="form-control" placeholder="Scan or enter code..." autofocus autocomplete="off">
        <button type="button" id="QRButtonscan" class="btn btn-primary scanner"
                hx-post="{% url 'movement scanner' 'scan' 'toggle' %}"
                hx-swap="outerHTML" hx-target="#scannerDivscan" hx-trigger="click">QR</button>
    </div>
    <input class="visually-hidden" id="activ-scanner-input" name="active_scanner">
</form>
<div id="scannerDivscan"></div>

<input id="movementSearch" name="search" class="form-control mb-2" placeholder="Search..."
       hx-get="{% url 'movement search' %}" hx-target="#searchResults" hx-trigger="input changed delay:300ms">
<div id="searchResults" class="list-group mb-2"></div>

{% include "movement/buffer.html" %}

{% endblock %}
