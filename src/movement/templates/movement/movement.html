{% extends "hub/header.html" %}
{% load i18n %}

{% block content %}

<form id="scanForm" class="mb-2" hx-post="{% url 'movement scan' %}" hx-target="#movementBuffer" hx-swap="outerHTML"
      hx-on::after-request="document.getElementById('scan').value=''">
    {% csrf_token %}
    <div class="input-group">
        <input id="scan" name="code" class="form-control" placeholder="{% trans "Scan or enter code..." %}" autofocus autocomplete="off">
        {% include "hub/modules/qrScanner.html" with input="scan" scannerUrl="/movement/scanner/scan/toggle" %}
    </div>
    <div id="scannerDivscan"></div>
</form>

<input id="movementSearch" name="search" class="form-control mb-2" placeholder="{% trans "Search..." %}"
       hx-get="{% url 'movement search' %}" hx-target="#searchResults" hx-trigger="input changed delay:300ms">
<div id="searchResults" class="list-group mb-2"></div>

<a class="btn btn-outline-primary mb-2" href="{% url 'inventory' %}">{% trans "Start inventory" %}</a>

{% include "movement/buffer.html" %}

<script>
(function () {
    var sound = {{ scan_feedback.sound|yesno:"true,false" }};
    var vibration = {{ scan_feedback.vibration|yesno:"true,false" }};
    var volume = {{ scan_feedback.volume|default:50 }} / 100;

    function beep(freq) {
        if (!sound || volume <= 0) { return; }
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) { return; }
        var ctx = new Ctx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
        osc.onended = function () { ctx.close(); };
    }

    function vibrate(pattern) {
        if (vibration && navigator.vibrate) { navigator.vibrate(pattern); }
    }

    document.body.addEventListener("movementScan", function () {
        beep(880);
        vibrate(80);
    });
    document.body.addEventListener("movementError", function () {
        beep(220);
        vibrate([80, 60, 80]);
    });
})();
</script>

{% endblock %}
