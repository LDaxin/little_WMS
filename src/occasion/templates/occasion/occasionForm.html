{% extends "hub/header.html" %}

{% block content %}
<h4>Add occasion</h4>

{% if error %}<div class="alert alert-danger py-1">{{ error }}</div>{% endif %}

<form method="post">
    {% csrf_token %}
    <div class="mb-2"><input name="name" class="form-control" placeholder="Name" required></div>
    <div class="mb-2">
        <select name="template" class="form-select">
            <option value="">&mdash; template (optional) &mdash;</option>
            {% for t in templates %}<option value="{{ t.pk }}" data-type="{{ t.occasion_type_id }}">{{ t.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-2">
        <select name="type" class="form-select" required>
            <option value="">&mdash; type &mdash;</option>
            {% for t in types %}<option value="{{ t.pk }}">{{ t.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-2"><input name="start_date" type="date" class="form-control" required></div>
    <div class="mb-2"><input name="end_date" type="date" class="form-control"></div>
    <div class="mb-2">
        <select name="location" class="form-select">
            <option value="">&mdash; location (optional) &mdash;</option>
            {% for l in locations %}<option value="{{ l.pk }}">{{ l }}</option>{% endfor %}
        </select>
    </div>
    <div class="mb-2"><input name="participants" type="number" min="1" class="form-control" placeholder="Participants"></div>
    <button class="btn btn-primary">Create</button>
</form>
<script>
    document.querySelector("[name=template]").addEventListener("change", function () {
        var opt = this.selectedOptions[0];
        if (opt && opt.dataset.type) {
            document.querySelector("[name=type]").value = opt.dataset.type;
        }
    });
</script>
{% endblock %}
