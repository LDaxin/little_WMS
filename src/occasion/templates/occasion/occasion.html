{% extends "hub/header.html" %}

{% block content %}
<h4>{{ occasion }} <small class="text-muted">{{ occasion.occasion_type.name }}</small></h4>

<form method="post" action="{% url 'update occasion' occasion.pk %}" class="row g-2 align-items-end mb-3">
    {% csrf_token %}
    <div class="col-auto"><input name="name" class="form-control" value="{{ occasion.calendar_entry.title }}" placeholder="Name"></div>
    <div class="col-auto"><input name="start_date" type="date" class="form-control" value="{{ occasion.calendar_entry.start_date|date:'Y-m-d' }}"></div>
    <div class="col-auto"><input name="end_date" type="date" class="form-control" value="{{ occasion.calendar_entry.end_date|date:'Y-m-d' }}"></div>
    <div class="col-auto">
        <select name="location" class="form-select">
            <option value="">&mdash; location &mdash;</option>
            {% for l in locations %}<option value="{{ l.pk }}" {% if occasion.location_id == l.pk %}selected{% endif %}>{{ l }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-auto"><input name="participants" type="number" min="1" class="form-control" value="{{ occasion.participant_count|default_if_none:'' }}" placeholder="Participants"></div>
    <div class="col-auto"><button class="btn btn-primary">Save</button></div>
</form>

{% include "occasion/packlist.html" %}

<form method="post" action="{% url 'save occasion as template' occasion.pk %}" class="d-flex gap-2 align-items-center mb-3">
    {% csrf_token %}
    <input name="name" class="form-control" style="max-width:16rem" placeholder="Template name" value="{{ occasion }}">
    <button class="btn btn-outline-secondary">Save as template</button>
</form>

<form method="post" action="{% url 'delete occasion' occasion.pk %}" onsubmit="return confirm('Delete this occasion?');">
    {% csrf_token %}
    <button class="btn btn-outline-danger">Delete occasion</button>
</form>
{% endblock %}
