{% extends "hub/header.html" %}
{% load i18n %}

{% block content %}
<h4>{{ link.saved_view.name }}</h4>

{% if error %}<div class="alert alert-danger py-1">{{ error }}</div>{% endif %}

<form method="post" class="d-flex gap-2" style="max-width:24rem">
    {% csrf_token %}
    <input name="password" type="password" class="form-control" placeholder="{% trans "Password" %}">
    <button class="btn btn-primary">{% trans "Open" %}</button>
</form>
{% endblock %}
