services:
  web:
    build: ./
    command: python manage.py runserver 0.0.0.0:8567
    volumes:
      - ./django_project/:/app/wms
    ports:
      - 8567:8567
    env_file:
      - ./.env.dev
    depends_on:
      - db
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=change_me_user
      - POSTGRES_PASSWORD=change_me_password
      - POSTGRES_DB=db_little_wms_dev

volumes:
  postgres_data:
